# Base file: service shapes shared by dev and prod. Contains no `build:` or
# `image:` for backend, and no frontend services at all — staff/website never
# run in prod (project_decisions.md §3.7), so they exist only in
# docker-compose.override.yml. Neither this file alone nor prod without an
# overlay is runnable; it always needs docker-compose.override.yml (dev,
# auto-applied) or docker-compose.prod.yml (prod, explicit -f) on top.

name: cornerstone

services:
  db:
    image: postgres:16 # identical in dev and prod, no reason to split this
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cornerstone}
      POSTGRES_USER: ${POSTGRES_USER:-cornerstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cornerstone} -d ${POSTGRES_DB:-cornerstone}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cornerstone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cornerstone}?sslmode=disable

volumes:
  db-data:
